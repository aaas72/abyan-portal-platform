name: Backend Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'abyan-backend/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'abyan-backend/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. فحص واختبار الواجهة الخلفية (Backend CI)
  # ==========================================
  backend-ci:
    name: Backend (Lint, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abyan-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: abyan-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test -- --passWithNoTests

      - name: Build NestJS Application
        run: npm run build

  # ==========================================
  # 2. النشر التلقائي للباك إند (Production CD)
  # ==========================================
  backend-cd:
    name: Deploy Backend to Render
    needs: backend-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Deploy Hook
        if: env.RENDER_BACKEND_HOOK != ''
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering Backend deployment on Render..."
          curl -s -X POST "$RENDER_BACKEND_HOOK" > /dev/null
          echo "Backend deployment triggered successfully."
