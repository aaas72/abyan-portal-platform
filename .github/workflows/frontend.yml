name: Frontend Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'abyan-portal/**'
      - 'render.yaml'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'abyan-portal/**'
      - 'render.yaml'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. فحص وبناء الواجهة الأمامية (Frontend CI)
  # ==========================================
  frontend-ci:
    name: Frontend (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abyan-portal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: abyan-portal/package-lock.json

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: abyan-portal/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('abyan-portal/package-lock.json') }}-${{ hashFiles('abyan-portal/src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('abyan-portal/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: https://api.placeholder.com
        run: npm run build

  # ==========================================
  # 2. النشر التلقائي للفرونت إند (Production CD)
  # ==========================================
  frontend-cd:
    name: Deploy Frontend to Render
    needs: frontend-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Frontend Deploy Hook
        if: env.RENDER_FRONTEND_HOOK != ''
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering Frontend deployment on Render..."
          curl -s -X POST "$RENDER_FRONTEND_HOOK" > /dev/null
          echo "Frontend deployment triggered successfully."
