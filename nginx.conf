# ═══════════════════════════════════════════════════════════════════════
#  بوابة أبين — إعداد Nginx
#
#  ملاحظة معمارية: الـ API يُمرَّر على نفس الأصل (abyan.gov.ye/api/) عبر
#  proxy_pass أدناه. هذا يجعل:
#    • connect-src 'self' كافياً في CSP بلا أي نطاق خارجي
#    • كوكي المصادقة sameSite=strict يعمل بلا مشاكل (لا طلبات عبر المواقع)
#  إن فُصل الـ API إلى نطاق آخر مستقبلاً، يجب تعديل الاثنين معاً.
# ═══════════════════════════════════════════════════════════════════════

# ── HTTP: لا يخدم شيئاً سوى إعادة التوجيه إلى HTTPS ──
# بدون هذا القسم يبقى الموقع متاحاً على http، فتُرسل الكوكي والبيانات
# بلا تشفير، ويتجاهل المتصفح رأس HSTS تماماً لأنه يصل عبر قناة غير آمنة.
server {
    listen 80;
    listen [::]:80;
    server_name abyan.gov.ye www.abyan.gov.ye;

    # تحدي Let's Encrypt يبقى متاحاً على http لتجديد الشهادة
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: الخادم الفعلي ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name abyan.gov.ye www.abyan.gov.ye;

    # عدّل المسارات بما يطابق شهادتك
    ssl_certificate     /etc/letsencrypt/live/abyan.gov.ye/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abyan.gov.ye/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── رؤوس الأمان ──
    #
    # script-src: 'unsafe-inline' مطلوب فعلاً — تصدير Next.js الساكن يبثّ
    #   وسوم <script> مضمّنة لبيانات الترطيب (self.__next_f.push)، ولا يمكن
    #   استخدام nonce مع صفحات ساكنة تُخدَم من القرص.
    #   'unsafe-eval' أُزيل: تحقّقنا أن البناء الإنتاجي لا يحوي eval إطلاقاً.
    # connect-src 'self': الـ API على نفس الأصل عبر proxy_pass أدناه.
    # الخطوط: globals.css يستورد Amiri و Cairo من Google Fonts وتُستعمل
    #   بالاسم في متغيّرات CSS، لذا يبقى النطاقان مسموحين.
    #   لتشديد أكبر: استضف الخطين محلياً ثم احذفهما من هنا.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # لا تكشف إصدار Nginx في الردود ورسائل الخطأ
    server_tokens off;

    # حد حجم الطلب — يطابق حد express.json في الواجهة الخلفية
    client_max_body_size 5m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── الواجهة الأمامية (تصدير Next.js ساكن) ──
    location / {
        root /var/www/abyan-portal/out;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ملفات البناء تحمل بصمة في اسمها، فيمكن تخزينها مؤقتاً بلا حدود
    location /_next/static/ {
        root /var/www/abyan-portal/out;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── تمرير الـ API ──
    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
